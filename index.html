<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="여행 전에 정리해 둔 리서치 페이지 모음.">
<title>여행 리서치</title>
<style>
:root{--paper:#f7f5ef;--ink:#243a31;--muted:#6f776f;--line:#dedfd5;--accent:#9a593f;--hover:#eee7dc;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#18201c;--ink:#e8e6de;--muted:#9aa29a;--line:#2f3a34;--accent:#d49473;--hover:#222c27}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans);word-break:keep-all}
main{max-width:640px;margin:0 auto;padding:72px 16px 96px}
h1{font:600 2rem/1.3 var(--serif);margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 48px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
a{display:block;padding:20px 8px;color:inherit;text-decoration:none;border-radius:4px}
a:hover{background:var(--hover)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.meta{font-size:.8rem;color:var(--accent);letter-spacing:.04em}
.name{display:block;font:600 1.2rem/1.4 var(--serif);margin:2px 0 4px}
.desc{display:block;color:var(--muted);font-size:.95rem}
footer{margin-top:48px;color:var(--muted);font-size:.8rem}
footer a{display:inline;padding:0;text-decoration:underline}
</style>
</head>
<body>
<main>
<h1>여행 리서치</h1>
<p class="lede">떠나기 전에 정리해 둔 페이지들.</p>

<!-- 새 페이지는 맨 위에 추가: 폴더 이름/ 으로 링크 -->
<ul>
  <li><a href="china-autumn-2026/">
    <span class="meta">2026.11 · 중국</span>
    <span class="name">가을의 중국, 세 가지 여행</span>
    <span class="desc">청두의 차와 문화, 구이린의 산수, 쿤밍·리장의 고원 풍경 비교</span>
  </a></li>
</ul>

<footer>콘텐츠는 <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a> 라이선스를 따릅니다.</footer>
</main>
</body>
</html>
